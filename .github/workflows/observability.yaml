name: Observability

on:
  push:
    branches: [main]
    paths:
      - "monitoring/**"
      - "logging/**"
      - ".github/workflows/observability.yaml"

  workflow_dispatch:

jobs:
  deploy-observability:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Deploy observability stack through Systems Manager
        env:
          AWS_PAGER: ""
        run: |
          cat > /tmp/deploy-observability.json <<EOF2
          {
            "commands": [
              "set -e",
              "rm -rf /tmp/devops-lab-observability",
              "git clone --depth 1 https://github.com/AlphaKoder7/Devops-Lab.git /tmp/devops-lab-observability",
              "cd /tmp/devops-lab-observability",
              "helm repo add grafana https://grafana.github.io/helm-charts || true",
              "helm repo update",
              "KUBECONFIG=/etc/rancher/k3s/k3s.yaml helm upgrade --install monitoring oci://ghcr.io/prometheus-community/charts/kube-prometheus-stack --version 91.8.1 --namespace monitoring --create-namespace --reset-values -f monitoring/values.yaml",
              "KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl apply -k monitoring",
              "KUBECONFIG=/etc/rancher/k3s/k3s.yaml helm upgrade --install loki oci://ghcr.io/grafana-community/helm-charts/loki --version 18.13.8 --namespace logging --create-namespace -f logging/loki-values.yaml",
              "KUBECONFIG=/etc/rancher/k3s/k3s.yaml helm upgrade --install alloy grafana/alloy --version 1.13.0 --namespace logging --create-namespace -f logging/alloy-values.yaml",
              "KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl rollout status deployment/monitoring-grafana -n monitoring --timeout=180s",
              "KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl rollout status statefulset/loki -n logging --timeout=180s",
              "KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl rollout status deployment/alloy -n logging --timeout=180s"
            ]
          }
          EOF2

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.AWS_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy observability ${GITHUB_SHA}" \
            --parameters file:///tmp/deploy-observability.json \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.AWS_INSTANCE_ID }}"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.AWS_INSTANCE_ID }}" \
            --query "{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}"
