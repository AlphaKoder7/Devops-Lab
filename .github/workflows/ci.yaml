name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v

  build-and-push:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/alphakoder7/devops-lab-api:latest
            ghcr.io/alphakoder7/devops-lab-api:${{ github.sha }}

  deploy:
    needs: build-and-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Deploy with Helm through Systems Manager
        env:
          AWS_PAGER: ""
        run: |
          cat > /tmp/deploy.json <<EOF2
          {
            "commands": [
              "set -e",
              "rm -rf /tmp/devops-lab-deploy",
              "git clone --depth 1 https://github.com/AlphaKoder7/Devops-Lab.git /tmp/devops-lab-deploy",
              "cd /tmp/devops-lab-deploy",
              "KUBECONFIG=/etc/rancher/k3s/k3s.yaml helm upgrade --install devops-lab-api ./helm/devops-lab-api --set image.tag=${GITHUB_SHA}",
              "KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl rollout status deployment/devops-lab-api --timeout=120s"
            ]
          }
          EOF2

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.AWS_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${GITHUB_SHA}" \
            --parameters file:///tmp/deploy.json \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.AWS_INSTANCE_ID }}"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.AWS_INSTANCE_ID }}" \
            --query "{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}"
