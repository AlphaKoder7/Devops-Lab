services:
  api:
    build:
      context: .
    image: devops-lab-api:0.1.0
    container_name: devops-lab-api
    ports:
      - "8000:8000"
    environment:
      APP_VERSION: "0.1.0"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 10s
      timeout: 3s
      retries: 3
